name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The integration tests start real Kafka and PostgreSQL with Testcontainers (Docker is preinstalled).
      - name: Build and test
        run: mvn -B verify

spring:
  application:
    name: rewards-event-pipeline
  # Local run: reads .env (git-ignored) if present. In CI/tests the values come from Testcontainers (D-009).
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${POSTGRES_DB:rewards}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${rewards.kafka.consumer-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # reject unknown JSON fields (CWE-20)
      accept-float-as-int: false         # 10.5 is not a whole number
    mapper:
      allow-coercion-of-scalars: false   # "10" (a string) is not a number

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

rewards:
  topics:
    purchases: purchases
    purchases-dlt: purchases.DLT
    partitions: 3
  kafka:
    consumer-group: rewards-points-consumer
    send-timeout-ms: 5000
  retry:
    max-attempts: 3
    backoff-ms: 1000
  points:
    rupees-per-point: 10
